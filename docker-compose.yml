version: "3.9"

services:
  # ─── Database ─────────────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: bhoomisync_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhoomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhoomi_secret}
      POSTGRES_DB: ${POSTGRES_DB:-landstack}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomi -d landstack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Vector Tile Server (MVT from PostGIS) ────────────────────────────────
  pg_tileserv:
    image: pramsey/pg_tileserv:latest
    container_name: bhoomisync_tileserv
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bhoomi}:${POSTGRES_PASSWORD:-bhoomi_secret}@db:5432/${POSTGRES_DB:-landstack}
    ports:
      - "7800:7800"
    depends_on:
      db:
        condition: service_healthy

  # ─── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomisync_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bhoomi}:${POSTGRES_PASSWORD:-bhoomi_secret}@db:5432/${POSTGRES_DB:-landstack}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-bhoomi}:${POSTGRES_PASSWORD:-bhoomi_secret}@db:5432/${POSTGRES_DB:-landstack}
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomisync_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_TILESERV_URL: http://localhost:7800
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pg_data:
